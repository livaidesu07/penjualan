<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pelanggan</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pelanggan.css') }}">
</head>
<body>

    <main class="edit-form-container">

        <section class="form-card">

            <div class="form-heading">
                <h1>Edit Pelanggan</h1>
                <p>Perbarui informasi pelanggan.</p>
            </div>

            <form method="POST"
                  action="{{ url_for('edit_pelanggan', id_pelanggan=data[0]) }}">

                <div class="form-group">
                    <label for="id_pelanggan">ID Pelanggan</label>
                    <input type="text"
                           id="id_pelanggan"
                           value="{{ data[0] }}"
                           readonly>
                </div>

                <div class="form-group">
                    <label for="nama_pelanggan">Nama Pelanggan</label>
                    <input type="text"
                           id="nama_pelanggan"
                           name="nama_pelanggan"
                           value="{{ data[1] }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat"
                              name="alamat">{{ data[2] or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="no_hp">Nomor HP</label>
                    <input type="text"
                           id="no_hp"
                           name="no_hp"
                           value="{{ data[3] or '' }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">
                        Simpan Perubahan
                    </button>

                    <a href="{{ url_for('pelanggan') }}" class="btn-cancel">
                        Batal
                    </a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
