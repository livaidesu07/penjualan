<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pelanggan.css') }}">
</head>
<body>

<div class="form-page">

    <div class="form-card">

        <div class="form-heading">
            <h2>Tambah Pelanggan</h2>
            <p>Masukkan informasi pelanggan baru.</p>
        </div>

        <form action="{{ url_for('tambah_pelanggan') }}" method="POST">

            <div class="form-group">
                <label>ID Pelanggan</label>
                <input type="text" name="id_pelanggan" required>
            </div>

            <div class="form-group">
                <label>Nama Pelanggan</label>
                <input type="text" name="nama_pelanggan" required>
            </div>

            <div class="form-group">
                <label>Alamat</label>
                <textarea name="alamat"></textarea>
            </div>

            <div class="form-group">
                <label>Nomor HP</label>
                <input type="text" name="no_hp">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Simpan Pelanggan</button>
                <a href="{{ url_for('pelanggan') }}" class="btn-cancel">Batal</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
